{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Search History - Movie Recommendation System</title>
    <link rel="shortcut icon" href="{% static 'logo.png' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons@latest/iconfont/tabler-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/5.0.0/normalize.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.5.0/css/bootstrap.min.css'>

    <link rel="stylesheet" href="{% static 'recommender/cursor.css' %}" type="text/css">
    <link rel="stylesheet" href="{% static 'recommender/page.css' %}" type="text/css">
    <style>
        .history-container {
            max-width: 600px;
            margin: 60px auto;
            padding: 40px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            color: #fff;
        }

        .history-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 25px;
            background: -webkit-linear-gradient(45deg, #ff416c, #ff4b2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .history-list {
            list-style: none;
            padding: 0;
        }

        .history-item {
            padding: 14px 20px;
            margin-bottom: 12px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }

        .history-item:hover {
            background: rgba(255, 75, 43, 0.2);
            border-color: rgba(255, 75, 43, 0.5);
            transform: translateX(4px);
        }

        .history-movie-link {
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            font-size: 1.1rem;
        }

        .history-movie-link:hover {
            color: #ff4b2b;
            text-decoration: none;
        }

        .history-movie-link i.fa-film {
            color: #ff4b2b;
            margin-right: 12px;
        }

        .history-movie-link .search-icon {
            font-size: 0.9rem;
            color: #aaa;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .history-movie-link:hover .search-icon {
            color: #ff4b2b;
            transform: translateX(3px);
        }

        .empty-history {
            text-align: center;
            color: #aaa;
            font-style: italic;
            margin: 30px 0;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #ff4b2b;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="history-container">
        <h2 class="history-title"><i class="fa fa-history"></i> Search History</h2>
        <p class="text-center text-muted" style="color: #ccc !important;">Logged in as: <strong>{{ request.user.username }}</strong></p>

        {% if search_history %}
        <ul class="history-list">
            {% for item in search_history %}
            <li class="history-item">
                <a href="{% url 'main' %}?movie_name={{ item|urlencode }}" class="history-movie-link">
                    <span><i class="fa fa-film"></i> {{ item }}</span>
                    <i class="fa fa-search search-icon" title="Search again"></i>
                </a>
            </li>
            {% endfor %}
        </ul>
        {% else %}
        <div class="empty-history">
            <p><i class="fa fa-info-circle"></i> No movie search history found yet.</p>
        </div>
        {% endif %}

        <a href="{% url 'main' %}" class="back-link"><i class="fa fa-arrow-left"></i> Back to Movie Search</a>
    </div>
</body>

</html>
