{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Login - Movie Recommendation System</title>
    <link rel="shortcut icon" href="{% static 'logo.png' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons@latest/iconfont/tabler-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/5.0.0/normalize.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.5.0/css/bootstrap.min.css'>

    <link rel="stylesheet" href="{% static 'recommender/cursor.css' %}" type="text/css">
    <link rel="stylesheet" href="{% static 'recommender/page.css' %}" type="text/css">
    <style>
        .auth-container {
            max-width: 420px;
            margin: 80px auto;
            padding: 40px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            color: #fff;
        }

        .auth-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 25px;
            background: -webkit-linear-gradient(45deg, #ff416c, #ff4b2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group label {
            font-weight: 600;
            color: #ddd;
        }

        .auth-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            margin-bottom: 20px;
            outline: none;
            transition: all 0.3s ease;
        }

        .auth-input:focus {
            border-color: #ff4b2b;
            box-shadow: 0 0 8px rgba(255, 75, 43, 0.4);
        }

        .auth-button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .auth-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 75, 43, 0.4);
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            color: #ccc;
        }

        .auth-footer a {
            color: #ff4b2b;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .alert-messages {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <h2 class="auth-title"><i class="fa fa-user-circle"></i> Login</h2>

        {% if messages %}
        <div class="alert-messages">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }} p-2" role="alert" style="font-size: 0.9rem;">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="username"><i class="fa fa-user"></i> Username</label>
                <input type="text" class="auth-input" id="username" name="username" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label for="password"><i class="fa fa-lock"></i> Password</label>
                <input type="password" class="auth-input" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="auth-button">Login</button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="{% url 'signup' %}">Sign Up</a></p>
            <p><a href="{% url 'main' %}"><i class="fa fa-arrow-left"></i> Back to Home</a></p>
        </div>
    </div>
</body>

</html>
